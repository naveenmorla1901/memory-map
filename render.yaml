# One-click hosting on Render: Dashboard -> New -> Blueprint -> this repo.
# Creates the API (Docker) and a Postgres database, wired together.
# After the first deploy, fill in GOOGLE_API_KEY (and optionally the Gmail
# settings) under the service's Environment tab. See DEVELOPER_GUIDE.md in
# the app repo for the whole setup.
services:
  - type: web
    name: memory-map-api
    runtime: docker
    plan: free
    healthCheckPath: /healthz/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: memory-map-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: NUM_PROXIES
        value: "1"
      - key: GOOGLE_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Optional: upload an Instagram cookies.txt as a Render "Secret File"
      # named instagram_cookies.txt and uncomment:
      # - key: INSTAGRAM_YTDLP_COOKIES_FILE
      #   value: /etc/secrets/instagram_cookies.txt

databases:
  - name: memory-map-db
    plan: free
