name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: memorymap
          POSTGRES_USER: memorymap
          POSTGRES_PASSWORD: memorymap
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memorymap"
          --health-interval 5s --health-retries 10
    env:
      DEBUG: "True"
      SECRET_KEY: ci-only-secret
      DATABASE_URL: postgres://memorymap:memorymap@localhost:5432/memorymap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yml
      - run: python manage.py test
      - name: Production settings pass Django's deploy checks
        env:
          DEBUG: "False"
          SECRET_KEY: ci-only-secret-that-is-long-enough-for-the-deploy-check-0123456789
          ALLOWED_HOSTS: api.example.com
          PUBLIC_BASE_URL: https://api.example.com
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t memory-map-backend .
