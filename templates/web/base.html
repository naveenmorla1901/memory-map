<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}{{ site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}Save the places you want to remember - by hand, or straight from an Instagram reel.{% endblock %}">
  <style>
    :root {
      --bg: #fbf7f4; --surface: #ffffff; --text: #1f1a1c; --muted: #6b6266;
      --border: #ebe3df; --primary: #e8424f; --primary-ink: #ffffff; --error: #c62828;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #141113; --surface: #1e1a1c; --text: #f3eeee; --muted: #a79da0;
              --border: #2f292b; --primary: #ff5c68; --error: #ff6b6b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    a { color: var(--primary); }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header { display: flex; align-items: center; justify-content: space-between; padding-top: 20px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px;
             color: var(--text); text-decoration: none; }
    .brand svg { width: 28px; height: 28px; }
    main { padding-top: 32px; padding-bottom: 48px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 0 0 12px; letter-spacing: -0.02em; }
    h2 { font-size: 20px; margin: 32px 0 8px; }
    .lead { font-size: 18px; color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 24px; }
    label { display: block; font-weight: 600; font-size: 14px; margin: 16px 0 6px; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text); }
    input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    .check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; margin-top: 18px; }
    .check input { margin-top: 5px; }
    button { margin-top: 20px; width: 100%; padding: 13px; border: 0; border-radius: 10px;
             font-size: 16px; font-weight: 600; background: var(--primary); color: var(--primary-ink);
             cursor: pointer; }
    button.danger { background: var(--error); }
    .errors { color: var(--error); font-size: 14px; margin: 6px 0 0; padding-left: 18px; }
    .muted { color: var(--muted); font-size: 14px; }
    footer { padding-bottom: 32px; color: var(--muted); font-size: 14px;
             display: flex; gap: 16px; flex-wrap: wrap; border-top: 1px solid var(--border); padding-top: 20px; }
    footer a { color: var(--muted); }
    ul.features { padding-left: 0; list-style: none; }
    ul.features li { padding: 14px 0; border-bottom: 1px solid var(--border); }
    ul.features strong { display: block; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#e8424f" d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/></svg>
      {{ site_name }}
    </a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <a href="/privacy/">Privacy</a>
    <a href="/terms/">Terms</a>
    <a href="/delete-account/">Delete account</a>
    <a href="mailto:{{ support_email }}">Contact</a>
  </footer>
</body>
</html>
